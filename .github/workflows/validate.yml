name: Validate

on:
  push:
  pull_request:

jobs:
  scripts-and-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check Bash syntax
        run: |
          bash -n setup.sh
          bash -n scripts/upgrade.sh
          bash -n scripts/uninstall.sh
          bash -n vault-template/scripts/organize-social-assets.sh
          bash -n scripts/opencode-obsidian-doctor.sh
          bash -n scripts/check-doc-links.sh
          bash -n scripts/validate-docs.sh
          bash -n scripts/verify.sh
          bash -n tests/smoke-test.sh

      - name: Run shellcheck
        run: |
          shellcheck \
            setup.sh \
            scripts/upgrade.sh \
            scripts/uninstall.sh \
            vault-template/scripts/organize-social-assets.sh \
            scripts/opencode-obsidian-doctor.sh \
            scripts/check-doc-links.sh \
            scripts/validate-docs.sh \
            scripts/verify.sh \
            tests/smoke-test.sh

      - name: Smoke test setup / upgrade / uninstall
        run: bash tests/smoke-test.sh

      - name: Validate docs
        run: bash scripts/validate-docs.sh

  macos-system-bash:
    # 普通用户在 Mac 上跑脚本用的是系统自带的 /bin/bash 3.2，这里专门覆盖它
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test with /bin/bash 3.2
        run: BASH_BIN=/bin/bash /bin/bash tests/smoke-test.sh
